name: Build Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.x
      - name: Build portable application and MSI
        shell: pwsh
        run: |
          ./Build.ps1
          ./Build-Msi.ps1
      - name: Publish release downloads
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.2 artifacts/MyFences-1.0.2-win-x64.zip artifacts/MyFences-1.0.2-win-x64.msi --clobber
